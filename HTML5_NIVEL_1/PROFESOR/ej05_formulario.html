<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="shortcut icon" href="./uneweb.ico" type="image/x-icon">
</head>
<body>
    <h1>Ejemplo05 Formulario</h1>
    <form action="./php/ej05_formulario.php" method="get" enctype="multipart/form-data">
        <table>
            <tr>
                <td>Nombre:</td>
                <td>
                    <input type="text" name="nombre" id="" required>
                </td>
            </tr>
            <tr>
                <td>Edad:</td>
                <td>
                    <input type="number" name="edad" id="" min="0" max="120" required>
                </td>
            </tr>
            <tr>
                <td>Estatura:</td>
                <td>
                    <input type="number" name="estatura" id="" min="0" step="0.01" required>
                </td>
            </tr>
            <tr>
                <td>Fecha de Nacimiento:</td>
                <td>
                    <input type="date" name="fechanac" id="" required>
                </td>
            </tr>
            <tr>
                <td>Hora:</td>
                <td>
                    <input type="time" name="hora" id="" required>
                </td>
            </tr>
            <tr>
                <td>Semana:</td>
                <td>
                    <input type="week" name="semana" id="" required>
                </td>
            </tr>
            <tr>
                <td>Mes:</td>
                <td>
                    <input type="month" name="mes" id="" required>
                </td>
            </tr>
            <tr>
                <td>Fecha Hora:</td>
                <td>
                    <input type="datetime-local" name="fechahora" id="" required>
                </td>
            </tr>
            <tr>
                <td>Fecha Hora (ingresar dato):</td>
                <td>
                    <input type="datetime" name="fechahoraingresa" id="" required title="Debe ingresar la fecha y la hora, según el siguiente formato: aaaa-mm-dd hh:mm:ss">
                </td>
            </tr>
            <tr>
                <td>Correo electrónico:</td>
                <td>
                    <input type="email" name="correoelectronico" id="" required>
                </td>
            </tr>
            <tr>
                <td>Dirección:</td>
                <td>
                    <textarea name="direccion" id="" required></textarea>
                </td>
            </tr>
            <tr>
                <td>Clave secreta:</td>
                <td>
                    <input type="password" name="clavesecreta" id="" required>
                </td>
            </tr>
            <tr>
                <td>Valor oculto:</td>
                <td>
                    <input type="hidden" name="oculto" value="ESTE VALOR NO ES VISIBLE">
                </td>
            </tr>
            <tr>
                <!-- https://www.w3schools.com/colors/colors_picker.asp -->
                <td>Color:</td>
                <td>
                    <input type="color" name="color" id="" required>
                </td>
            </tr>
            <tr>
                <td>Rango:</td>
                <td>
                    <input type="range" 
                           name="rango" 
                           id="" 
                           required 
                           min="0" 
                           max="100" 
                           value="0"
                           onchange="salida.value=rango.value">
                    <output name="salida">0</output>
                </td>
            </tr>
            <tr>
                <td>Sexo:</td>
                <td>
                    <input type="radio" name="sexo" id="" value="F" checked>Femenino
                    <input type="radio" name="sexo" id="" value="M">Masculino
                </td>
            </tr>
            <tr>
                <td>Actvidad:</td>
                <td>
                    <input type="checkbox" 
                    name="actividad[]" 
                    id="" 
                    multiple 
                    value="Estudia">Estudia
                    <input type="checkbox" 
                    name="actividad[]" 
                    id="" 
                    multiple 
                    value="Trabaja">Trabaja
                    <input type="checkbox" 
                    name="actividad[]" 
                    id="" 
                    multiple 
                    value="Otra">Otra
                </td>
            </tr>
            <tr>
                <td>Archivo:</td>
                <td>
                    <!-- Al usar input del tipo "file", se requiere 
                         colocar en el formulario "form" el atributo 
                         enctype="multipart/form-data" -->
                    <input type="file" name="archivo" id="" required>
                </td>
            </tr>
            <tr>
                <td>Imagen:</td>
                <td>
                    <input type="image" src="./uneweb.png" alt="Logo de Uneweb">
                </td>
            </tr>
        </table>
        <input type="submit" value="ENVIAR">
        <input type="reset" value="LIMPIAR">
    </form>
</body>
</html>
