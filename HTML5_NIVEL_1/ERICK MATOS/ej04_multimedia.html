<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo04</title>
    <link rel="shortcut icon" href="../img/uneweb.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/ej04_multimedia.css">
</head>

<body>
    <h1>Etiquetas Multimedia</h1>
    <h2>Video</h2>
    <h2>Video de un solo archivo de origen</h2>
    <!--1er. caso, uso etiqueta video-->
    <video src="../video/152174-802335605_medium.mp4" controls>Su navegador web, no soporta la etiqueta video.
        <track kind="subtitles" srclang="es" label="Español" src="./track/pista1.vtt">Su navegador web, no soporta la
        etiqueta track.
        </track>
        <track kind="subtitles" srclang="en" label="Ingles" src="./track/pista2.vtt">Su navegador web, no soporta la
        etiqueta track.
        </track>
    </video>

    <hr>

    <!--Track, pistas de video temporizadas, son archivos VTT-->
    <h2>Video de múltiples archivos de origen</h2>
    <!--2do. Caso, uso etiqueta video-->
    <video controls>
        <source src="../video/152174-802335605_medium.mp4" type="video/mp4">
        <source src="../video/152174-802335605_medium.web" type="video/webm">
        <source src="../video/152174-802335605_medium.ogg" type="video/ogg">
        <track kind="subtitles" srclang="es" label="Español" src="./track/pista1.vtt"></track>
        <track kind="subtitles" srclang="en" label="Ingles" src="./track/pista2.vtt"></track>
        Su navegador web, no soporta la etiqueta video.
    </video>

    <hr>

    <h2>Audio</h2>
    <h2>Audio de un solo archivo de origen</h2>
    <audio src="../audio/hot_dope-epic-4-625768.mp3" controls>Su navegador web, no soporta la etiqueta audio.</audio>

    <hr>

    <h2>Audio de múltiples archivos de origen</h2>
    <audio controls>
        <source src="../audio/hot_dope-epic-4-625768.mp3" type="audio/mp3">
        <source src="../audio/hot_dope-epic-4-625768.ogg" type="audio/ogg">
        <source src="../audio/hot_dope-epic-4-625768.wav" type="audio/wav">
    </audio>>

</body>

</html>
