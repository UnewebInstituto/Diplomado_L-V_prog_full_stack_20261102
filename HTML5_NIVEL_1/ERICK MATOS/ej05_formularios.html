<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Ejemplo05</title>
    <link rel="shortcut icon" href="./uneweb.ico" type="image/x-icon">
</head>
<body>
    <!--ETIQUETAS DE FORMULARIO:
        <form></form>
        Se pueden capturar datos por metodo GET o metodo POST,
        el metodo GET expone los datos en la URL y 
        puede transmitir 255 variables,por el metodo POST los datos 
        no se exponen en la url, cantidad de variables ilimitado-->
    <h1>Ejemplo05 Formularios</h1>
    <form action="./php/ej05_formulario.php" method="get" enctype="multipart/form-data">
        <table>
            <tr>
                <td>NOMBRE:</td>
                <td>
                    <input type="text" name="nombre" id="" required>
                </td>
            </tr>
            <tr>
                <td>EDAD:</td>
                <td>
                    <input type="number" name="edad" id="" min="0" max="120" required>
                </td>
            </tr>
            <tr>
                <td>ESTATURA:</td>
                <td>
                    <input type="number" name="estatura" id="" min="0" step="0.01" required>
                </td>
            </tr>
            <tr>
                <td>FECHA DE NACIMIENTO:</td>
                <td>
                    <input type="date" name="fechanac" id="" required>
                </td>
            </tr>
            <tr>
                <td>HORA:</td>
                <td>
                    <input type="time" name="hora" id="" required>
                </td>
            </tr>
            <tr>
                <td>SEMANA:</td>
                <td>
                    <input type="week" name="semana" id="" required>
                </td>
            </tr>
            <tr>
                <td>MES:</td>
                <td>
                    <input type="month" name="mes" id="" required>
                </td>
            </tr>
            <tr>
                <td>FECHA HORA:</td>
                <td>
                    <input type="datetime-local" name="fechahora" id="" required>
                </td>
            </tr>
            <tr>
                <td>FECHA HORA ENTRADA (Ingresar Dato):</td>
                <td>
                    <input type="datetime" name="fechahoraingresa" id="" required title="Debe ingresar la fecha y la hora, según el siguiente formato: aaaa-mm-dd hh:mm:ss">
                </td>
            </tr>
            <tr>
                <td>EMAIL:</td>
                <td>
                    <input type="email" name="correoelectronico" id="" required>
                </td>
            </tr>
            <tr>
                <td>DIRECCIÓN:</td>
                <td>
                    <textarea name="direccion" id="" required></textarea>
                </td>
            </tr>
            <tr>
                <td>CLAVE SECRETA:</td>
                <td>
                    <input type="password" name="clavesecreta" id="" required>
                </td>
            </tr>
            <tr>
                <td>VALOR OCULTO:</td>
                <td>
                    <input type="hidden" name="oculto" id="" value="ESTE VALOR NO ES VISIBLE" required>
                </td>
            </tr>
            <tr>
                <td>COLOR:</td>
                <td>
                    <input type="color" name="color" id="" required>
                </td>
            </tr>
            <tr>
                <td>RANGO:</td>
                <td>
                    <input type="range" name="rango" id="" required min="0" max="100" value="0" onchange="salida.value=rango.value">
                    <!--Cuando el valor de "rango" varie, sera reflejado en el valor "salida"-->
                    <output name="salida">0</output>
                </td>
            </tr>
            <tr>
                <td>SEXO:</td>
                <td>
                    <input type="radio" name="sexo" id="" value="F" checked>Femenino
                    <input type="radio" name="sexo" id="" value="M" checked>Masculino
                </td>
            </tr>
            <tr>
                <td>ACTIVIDAD:</td>
                <td>
                    <input type="checkbox" name="actividad[]" id="" multiple value="Estudia">Estudia
                    <input type="checkbox" name="actividad[]" id="" multiple value="Trabaja">Trabaja
                    <input type="checkbox" name="actividad[]" id="" multiple value="Otro">Otro
                </td>
            </tr>
            <tr>
                <td>ARCHIVO:</td>
                <td>
                    <input type="file" name="archivo" id="" required>
                    <!--Al usar input de tipo "file", se requiere colocar en el formulario "form" el atributo enctype="multipart/form-data"-->
                    
                </td>
            </tr>
            <tr>
                <td>IMAGEN:</td>
                <td>
                    <input type="image" src="./uneweb.png" alt="Logo de Uneweb" id="">
                    
                </td>
            </tr>



        </table>

        <input type="submit" value="ENVIAR">
        <input type="reset" value="LIMPIAR"><!--Vacia todos los campos-->
    </form>

</body>
</html>
