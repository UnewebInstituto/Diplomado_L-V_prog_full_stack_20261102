<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag and Drop</title>
    <link rel="stylesheet" href="./css/ej05_draganddrop.css">
</head>
<body>
    <h1>API DRAG AND DROP</h1>
    <a href="https://www.w3schools.com/html/html5_draganddrop.asp" target="_blank">Documentación www.w3schools.com</a>
    <hr>
    <a href="\">Regresar</a>
    <hr>
    <div id="caja1"
         ondrop="dropHandler(event)" 
         ondragover="dragoverHandler(event)">
        <!-- 
        Atributos:
        draggable="true" , la imagen se puede mover
        ondragstart="funcion(event)" , qué hacer cuando inicia
        el arrastrado del contenido.
        ondrop="funcion(event)" , qué hacer cuando se suelta 
        el contenido.
        -->
        <img id="dibujo" 
             src="../img/1.jpg" 
             alt="Imagen que se puede reubicar" 
             draggable="true" 
             ondragstart="dragstartHandler(event)">
    </div>
    <div id="caja2" 
         ondrop="dropHandler(event)" 
         ondragover="dragoverHandler(event)"></div>
    
    <script src="./js/ej05_draganddrop.js"></script>
</body>
</html>
