<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcionalidad</title>
    <link rel="stylesheet" href="CSS/EJ03_funcionalidad.css">
</head>
<body>
<h1>Galería</h1>

    <div id="principal">
        <img id="img_principal" src="../img/1.jpg" alt="">


    </div>



<div id="secundario">
    
        <img src="../img/1.jpg" alt="imagen numero 1" onclick="cambiar(this)">
        <img src="../img/2.jpg" alt="imagen numero 2" onclick="cambiar(this)">
        <img src="../img/3.jpg" alt="imagen numero 3" onclick="cambiar(this)">
        <img src="../img/4.jpg" alt="imagen numero 4" onclick="cambiar(this)">
</div>


<script>
    
    function cambiar(etiqueta){
        document.getElementById("img_principal").src= etiqueta.src; 
    }

</script>

<script src="./JS/EJ03_funcionalidad.js">
     
</script>
    
</body>
</html>
